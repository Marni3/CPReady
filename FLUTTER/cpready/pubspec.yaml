name: cpready
description: "A new Flutter project."
publish_to: 'none'

# versionName+versionCode: the part after "+" becomes the Android versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.14.0-261.0.dev

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^2.0.0
  flutter_blue_plus: ^2.3.14
  go_router: ^14.2.0
  sqflite: ^2.4.4+2
  path_provider: ^2.1.6
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  # Material icon font used by the UI.
  uses-material-design: true

  # ---------------------------------------------------------------------------
  # Assets
  # ---------------------------------------------------------------------------
  # Images are read from `assets/images/` and referenced by
  # lib/src/config/assets.dart. The coaching cues are read from `assets/audio/`.
  assets:
    - assets/images/
    - assets/audio/

  # ---------------------------------------------------------------------------
  # Fonts
  # ---------------------------------------------------------------------------
  # The family name must match AppTypography.fontFamily; each weight is
  # declared once.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
