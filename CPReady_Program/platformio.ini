; Random rate/depth/recoil/duty and random hands-off gaps, including invalid
; compressions. Re-seeded every session; the final CCF is whatever results.
[env:simulation_inconsistent]
platform = espressif32 @ ~6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

build_flags =
    -I include
    -D CPREADY_SIMULATION
    -D SIM_PROFILE_RANDOM

build_src_filter = +<simulation.cpp> -<main.cpp>

lib_deps =
    ; Uses project-vendored Adafruit_MPU6050 from lib/ with MPU6500/Clone 0x70/0x72 WHO_AM_I support
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.17.4

