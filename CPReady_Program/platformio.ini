; PlatformIO Project Configuration File for CPReady
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

build_flags = 
    -I include

lib_deps = 
    ; Uses project-vendored Adafruit_MPU6050 from lib/ with MPU6500/Clone 0x70/0x72 WHO_AM_I support
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.17.4

[env:simulation]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

build_flags = 
    -I include
    -D CPREADY_SIMULATION

build_src_filter = +<simulation.cpp> -<main.cpp>

lib_deps = 
    ; Uses project-vendored Adafruit_MPU6050 from lib/ with MPU6500/Clone 0x70/0x72 WHO_AM_I support
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.17.4
