; PlatformIO Project Configuration File for CPReady
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32 @ ~6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

build_flags =
    -I include

lib_deps =
    ; Uses project-vendored Adafruit_MPU6050 from lib/ with MPU6500/Clone 0x70/0x72 WHO_AM_I support
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.17.4

[env:simulation]
platform = espressif32 @ ~6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

build_flags =
    -I include
    -D CPREADY_SIMULATION

build_src_filter = +<simulation.cpp> -<main.cpp>

lib_deps =
    ; Uses project-vendored Adafruit_MPU6050 from lib/ with MPU6500/Clone 0x70/0x72 WHO_AM_I support
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.17.4

; Dedicated recoil sweep: 11 release values, 30-100%, about 48 s per pass.
; Recoil-only strokes; the live capsule shows Partial for the low values and
; Full for the high values. The final summary is one aggregate percentage.
[env:simulation_recoil_partial]
platform = espressif32 @ ~6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

build_flags =
    -I include
    -D CPREADY_SIMULATION
    -D SIM_PROFILE_RECOIL

build_src_filter = +<simulation.cpp> -<main.cpp>

lib_deps =
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.17.4

; Continuous target strokes, no pauses. The app computes CCF ~100%.
[env:simulation_ccf_100]
platform = espressif32 @ ~6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

build_flags =
    -I include
    -D CPREADY_SIMULATION
    -D SIM_PROFILE_CONTINUOUS

build_src_filter = +<simulation.cpp> -<main.cpp>

lib_deps =
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.17.4

; 15 s cycle: 12 s compressions, 3 s hands-off. The app computes CCF ~80%.
[env:simulation_ccf_80]
platform = espressif32 @ ~6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

build_flags =
    -I include
    -D CPREADY_SIMULATION
    -D SIM_PAUSE_MS=3000

build_src_filter = +<simulation.cpp> -<main.cpp>

lib_deps =
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit BusIO @ ^1.17.4

; 15 s cycle: 9 s compressions, 6 s hands-off. The app computes CCF ~60%.
[env:simulation_ccf_60]
platform = espressif32 @ ~6.6.0
board = esp32dev
framework = arduino
